name: CI

# Pull requests: build, test, lint the builder and check both Dockerfiles still assemble. Nothing here publishes images or touches Azure; that is deploy.yml on main.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build Podium.slnx -c Release --nologo
      - run: dotnet test tests/Podium.Tests -c Release --no-build --nologo --logger "trx;LogFileName=results.trx" --results-directory TestResults
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: ignore

  builder:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: builder
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: builder/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Syntax-check builder scripts
        run: |
          node --check build.mjs
          node --check thumb.mjs
          bash -n entrypoint.sh
      - name: Lockfile is in sync with package.json
        run: npm ls --omit=dev >/dev/null

  images:
    # Builds both images without pushing so a broken Dockerfile or base-image change fails the PR, not the deploy.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Web image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: Builder image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: builder
          file: builder/Dockerfile
          push: false
          cache-from: type=gha,scope=builder
          cache-to: type=gha,mode=max,scope=builder
