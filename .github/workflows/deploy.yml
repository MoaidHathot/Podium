name: Build and deploy

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'builder/**'
      - 'Dockerfile'
      - 'Directory.Build.props'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      force:
        description: Deploy even while a live session asked to hold deployments
        type: boolean
        default: false

permissions:
  contents: read
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/podium/web
  BUILDER_IMAGE: ghcr.io/${{ github.repository_owner }}/podium/builder

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test tests/Podium.Tests -c Release --nologo

  images:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      web_digest: ${{ steps.web.outputs.digest }}
      builder_digest: ${{ steps.reuse.outputs.digest || steps.builder.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Lowercase image names
        run: |
          echo "WEB_IMAGE=${WEB_IMAGE,,}" >> "$GITHUB_ENV"
          echo "BUILDER_IMAGE=${BUILDER_IMAGE,,}" >> "$GITHUB_ENV"
      - name: Build and push web image
        id: web
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.WEB_IMAGE }}:latest
            ${{ env.WEB_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
          provenance: false
      # The builder image is identified by the git tree hash of builder/. Rebuilding it on every push would give a new
      # digest each time (image timestamps), and a new digest makes production rebuild every deck. Reuse the existing
      # image when nothing under builder/ changed; a manual run always rebuilds (base-image refresh).
      - name: Builder tree hash
        id: tree
        run: echo "sha=$(git rev-parse HEAD:builder)" >> "$GITHUB_OUTPUT"
      - name: Reuse builder image when builder/ is unchanged
        id: reuse
        run: |
          TAG="${BUILDER_IMAGE}:tree-${{ steps.tree.outputs.sha }}"
          DIGEST=""
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            DIGEST=$(docker buildx imagetools inspect "$TAG" --format '{{.Manifest.Digest}}' 2>/dev/null || true)
          fi
          if [ -n "$DIGEST" ]; then echo "Reusing $TAG @ $DIGEST"; else echo "Building builder image for tree ${{ steps.tree.outputs.sha }}"; fi
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
      - name: Build and push builder image
        id: builder
        if: steps.reuse.outputs.digest == ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: builder
          file: builder/Dockerfile
          push: true
          tags: |
            ${{ env.BUILDER_IMAGE }}:latest
            ${{ env.BUILDER_IMAGE }}:${{ github.sha }}
            ${{ env.BUILDER_IMAGE }}:tree-${{ steps.tree.outputs.sha }}
          cache-from: type=gha,scope=builder
          cache-to: type=gha,scope=builder,mode=max
          provenance: false

  deploy:
    needs: images
    runs-on: ubuntu-latest
    # Skipped until the Azure OIDC identity is configured (repository variables set by infra/deploy.ps1 output).
    if: vars.AZURE_CLIENT_ID != ''
    environment: production
    steps:
      - name: Azure login (workload identity federation, no secrets)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      # A deck owner can ask, per live session, that Podium itself is not rolled out mid-talk. Sessions end by
      # themselves when the presenter disappears (15 min), so this can never wait forever: bounded by
      # DEPLOY_GUARD_MAX_WAIT_MINUTES (repository variable; default 45, 0 disables) and overridable with the force input.
      - name: Wait for live sessions that hold deployments
        if: ${{ !inputs.force }}
        env:
          HEALTH_URL: ${{ vars.PODIUM_PUBLIC_URL || 'https://slides.moaid.codes' }}/healthz/live
          MAX_WAIT_MINUTES: ${{ vars.DEPLOY_GUARD_MAX_WAIT_MINUTES || '45' }}
        run: |
          set -uo pipefail
          if [ "$MAX_WAIT_MINUTES" = "0" ]; then echo "guard disabled"; exit 0; fi
          deadline=$(( $(date +%s) + MAX_WAIT_MINUTES * 60 ))
          while :; do
            body=$(curl -fsS --max-time 20 "$HEALTH_URL" || echo '{}')
            holding=$(echo "$body" | sed -n 's/.*"holdDeploys":\([0-9]*\).*/\1/p')
            holding=${holding:-0}
            if [ "$holding" = "0" ]; then echo "no live session is holding deployments"; exit 0; fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::$holding live session(s) still hold deployments after $MAX_WAIT_MINUTES minutes; re-run with force to override"
              exit 1
            fi
            echo "$holding live session(s) hold deployments; waiting 60s"
            sleep 60
          done
      - name: Update images (pinned by digest)
        run: |
          set -euo pipefail
          RG="${{ vars.AZURE_RESOURCE_GROUP }}"
          WEB="${WEB_IMAGE,,}@${{ needs.images.outputs.web_digest }}"
          BUILDER="${BUILDER_IMAGE,,}@${{ needs.images.outputs.builder_digest }}"
          if az containerapp job show -g "$RG" -n podium-builder -o none 2>/dev/null; then
            az containerapp job update -g "$RG" -n podium-builder --image "$BUILDER" -o none && echo "builder: $BUILDER"
          else
            echo "builder job not provisioned yet; skipping"
          fi
          if az containerapp show -g "$RG" -n podium-web -o none 2>/dev/null; then
            az containerapp update -g "$RG" -n podium-web --image "$WEB" -o none && echo "web: $WEB"
          else
            echo "web app not provisioned yet; skipping"
          fi
