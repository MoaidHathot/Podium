name: Memory profile

# On demand: runs the web image on a Linux runner under a cgroup memory and CPU limit (what Container Apps enforces),
# drives it through tests/smoke/memprofile.mjs (library of 112 decks, deck pages, presenting to a room through the
# relay with the phone remote, a live session with independent audience identities, everyone leaving) and reports
# the cgroup v2 memory.peak, the runtime's own heap figures and whether the kernel OOM-killed the container. Use it before changing
# the replica size in infra/app.bicep.
on:
  workflow_dispatch:
    inputs:
      memory:
        description: Container memory limit (docker --memory), e.g. 512m or 1g
        type: choice
        options: [512m, 1g]
        default: 512m
      cpus:
        description: Container CPU limit (docker --cpus)
        type: choice
        options: ['0.25', '0.5', '1']
        default: '0.5'
      viewers:
        description: Anonymous windows following the presenter
        default: '40'
      audience:
        description: People joining the live session through the code
        default: '40'
      loops:
        description: Drive loops (navigation, laser, blackout) to check for growth
        default: '3'
      collect:
        description: Force GC between every scenario (diagnostic retained-heap run, not natural peak usage)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PROFILE_MEMORY: ${{ inputs.memory }}
      PROFILE_CPUS: ${{ inputs.cpus }}
      PROFILE_VIEWERS: ${{ inputs.viewers }}
      PROFILE_AUDIENCE: ${{ inputs.audience }}
      PROFILE_LOOPS: ${{ inputs.loops }}
      MEMPROFILE_COLLECT: ${{ inputs.collect && '1' || '0' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Web image (same Dockerfile as the deploy)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: podium-web:profile
          cache-from: type=gha,scope=web
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: builder/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: builder
      - run: npx playwright install --with-deps chromium
        working-directory: builder
      - name: Start the container under the limit
        run: |
          docker run -d --name web --memory "$PROFILE_MEMORY" --memory-swap "$PROFILE_MEMORY" --cpus "$PROFILE_CPUS" -p 5199:8080 \
            -e ASPNETCORE_ENVIRONMENT=Development -e Storage__ConnectionString=memory -e Builder__Mode=LocalProcess \
            -e Builder__AutoRebuildOnUpgrade=false -e Podium__PublicBaseUrl=http://localhost:5199 -e Podium__ExternalBaseUrl=http://127.0.0.1:5199 \
            -e Podium__PublicGallery=true -e Podium__OwnerGitHubId=1001 -e Podium__SigningKey=aW50ZWdyYXRpb24tdGVzdC1zaWduaW5nLWtleS0wMTIzNDU2Nzg5 \
            -e Auth__AllowDevLogin=true -e GitHub__Token= -e Logging__LogLevel__Default=Warning \
            podium-web:profile
          for i in $(seq 1 40); do curl -fsS http://localhost:5199/healthz && break || sleep 1; done
          curl -fsS http://localhost:5199/healthz >/dev/null
          PID=$(docker inspect --format '{{.State.Pid}}' web)
          CGROUP="/sys/fs/cgroup$(awk -F: '$1 == "0" {print $3}' /proc/"$PID"/cgroup)"
          test -r "$CGROUP/memory.peak"
          printf '%s\n' "$CGROUP" > cgroup-path.txt
          echo "idle cache-subtracted Docker stats: $(docker stats --no-stream --format '{{.MemUsage}}' web)"
      - name: Profile
        timeout-minutes: 10
        run: |
          CGROUP=$(cat cgroup-path.txt)
          ( while test -r "$CGROUP/memory.current"; do
              printf '%s %s %s\n' "$(date +%s)" "$(cat "$CGROUP/memory.current")" "$(cat "$CGROUP/memory.peak")" >> stats.log
              sleep 1
            done ) &
          SAMPLER=$!
          trap 'kill "$SAMPLER" 2>/dev/null || true' EXIT
          MEMPROFILE_OUT=memprofile.json node tests/smoke/memprofile.mjs http://localhost:5199 "$PROFILE_VIEWERS" "$PROFILE_AUDIENCE" "$PROFILE_LOOPS"
      - name: Result
        if: always()
        run: |
          echo "## Memory profile ($PROFILE_MEMORY, $PROFILE_CPUS vCPU, $PROFILE_VIEWERS viewers, $PROFILE_AUDIENCE independent room participants)" >> "$GITHUB_STEP_SUMMARY"
          echo "Per-scenario forced GC: $MEMPROFILE_COLLECT (baseline/final collections always included)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          CGROUP=$(cat cgroup-path.txt)
          if test -r "$CGROUP/memory.peak"; then
            cat "$CGROUP/memory.peak" > cgroup-peak.txt
            cat "$CGROUP/memory.events" > cgroup-events.txt
            cat "$CGROUP/memory.stat" > cgroup-stat.txt
            echo "kernel cgroup peak: $(awk '{printf "%.1f", $1/1048576}' cgroup-peak.txt) MiB" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "cgroup no longer available; see OOM status and the saved samples" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          echo "OOM killed: $(docker inspect --format '{{.State.OOMKilled}}' web)  exit code: $(docker inspect --format '{{.State.ExitCode}}' web)  running: $(docker inspect --format '{{.State.Running}}' web)" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          if test -f memprofile.json; then
            node -e 'const j=require("./memprofile.json");for(const r of j.rows)console.log(`${r.scenario.padEnd(38)} ws ${r.ws} MiB  heap ${r.heapBefore} -> ${r.heapAfter} (${r.collected ? "forced GC" : "last GC"})  committed ${r.committed}  gen2 ${r.gen2}`);console.log(`sampled peak working set ${j.peakWorkingSetMb} MiB, largest last-GC heap ${j.peakHeapSnapshotMb} MiB, GC hard limit ${j.heapHardLimitMb} MiB`)' | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo '(profile failed before completion)' | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          docker logs web > server.log 2>&1
          test "$(docker inspect --format '{{.State.OOMKilled}}' web)" = "false"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: memprofile-${{ inputs.memory }}
          path: |
            memprofile.json
            stats.log
            cgroup-peak.txt
            cgroup-events.txt
            cgroup-stat.txt
            server.log
          if-no-files-found: ignore
      - name: Stop container
        if: always()
        run: docker rm -f web
